[package]
name = "move-it"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Move supported browser data between your devices"

[workspace]

[build-dependencies]
# Tauri build helper, MIT OR Apache-2.0. Pinned with the 2.12 shell stack.
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# Tauri shell. 2.8.5's lock pulled wry 0.53.x + tauri-runtime-wry that fail
# to compile (Sync bound). 2.12.5 + runtime-wry 2.12.3 + wry 0.57.1 check clean.
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-single-instance = "=2.3.4"
tauri-plugin-updater = "=2.14.1"
moveit-core = { path = "../../core" }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
