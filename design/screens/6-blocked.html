<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move It: 6 Browser open</title>
<link rel="stylesheet" href="../style/moveit.css">
</head>
<body class="screen-page">
<div>
  <div class="dev"><b>6 Browser open</b></div>
  <div class="app" data-screen="blocked">
    <section class="state" data-state="blocked">
      <div class="top"><span class="wordmark">Move It</span></div>
      <div class="stage"><div class="lemur" data-lemur="wait"></div></div>
      <h1 class="title">Close <span data-bind="browser">Brave</span> and tap again</h1>
      <p class="sub">Move It can only move your things while <span data-bind="browser">Brave</span> is closed.</p>
      <div class="actions"><button class="btn btn-primary" data-action="retry">Try again</button></div>
    </section>
  </div>
</div>
<script src="../loader/frames/manifest.js"></script>
<script src="../loader/moveit-loader.js"></script>
<script src="../style/icons.js"></script>
<script src="../style/screens.js"></script>
</body>
</html>
