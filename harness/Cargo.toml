[package]
name = "moveit-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Overnight stress test: fleets of virtual devices trade sealed boxes and must converge."

[dependencies]
moveit-core = { path = "../core" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
# Same base64 (MIT/Apache-2.0) the core pins; decodes Local State keys on Windows.
base64 = "=0.22.1"
tempfile = "3"
